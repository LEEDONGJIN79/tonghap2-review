<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>통합사회2 중간대비</title>
<meta name="description" content="통합사회2 중간고사 대비 문제 풀이 앱">
<meta name="theme-color" content="#f0e8d9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1612" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통합사회2 중간대비">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ───────── 토큰: 감성 학습지 팔레트 ───────── */
:root{
  color-scheme: light;
  --bg:#f0e8d9; --bg-g1:rgba(176,101,74,.07); --bg-g2:rgba(107,125,94,.07);
  --paper:#fdfaf3; --cream:#f6efe1;
  --ink:#3d3630; --ink-soft:#6e6258; --ink-mute:#8d8174;
  --line:#e5dccb; --line-strong:#d6cab4;
  --terra:#b0654a; --terra-deep:#8e4a33; --sage:#6b7d5e; --sage-deep:#4f6143;
  --plum:#8a7a9f; --ochre:#b08e4f;
  --terra-wash:#f6e4db; --sage-wash:#e7ecdf; --ochre-wash:#f4ead3; --plum-wash:#ece7f1;
  --btn:#8e4a33; --on-btn:#fdfaf3;
  --ok:#3f6b33; --bad:#a3412a;
  --shadow:0 1px 0 rgba(61,54,48,.04), 0 6px 18px -10px rgba(61,54,48,.25);
  /* 차트 */
  --s1:#b36043; --s2:#9476b7; --s3:#587b3b; --s4:#b68a33;
  --grid:#ece4d4; --axis:#cfc3ad;
  --hm-neg:#9a4728; --hm-pos:#50762e; --hm-mid:#efe8db; --hm-strong-text:#fdfaf3;
  --ord1:#df8c6f; --ord2:#b7684b; --ord3:#904529;
  /* 신호(상태) */
  --st-red:#b8322a; --st-yellow:#c48a0e; --st-green:#3b7d3a;
  --serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR","Source Han Serif K",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
  --r-sheet:18px; --r-card:14px; --r-chip:999px;
  --tab-h:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1c1612; --bg-g1:rgba(217,138,108,.06); --bg-g2:rgba(157,179,138,.05);
    --paper:#26201a; --cream:#2f2720;
    --ink:#efe5d6; --ink-soft:#c2b4a2; --ink-mute:#988a7a;
    --line:#3d342b; --line-strong:#4d4237;
    --terra:#d98a6c; --terra-deep:#e8a58a; --sage:#9db38a; --sage-deep:#b5c9a3;
    --plum:#b5a5cc; --ochre:#d6b06a;
    --terra-wash:#3a2a22; --sage-wash:#2a3024; --ochre-wash:#3a3022; --plum-wash:#302a38;
    --btn:#d98a6c; --on-btn:#1c1612;
    --ok:#a7c793; --bad:#ec9a80;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.6);
    --s1:#b96648; --s2:#9a7cbd; --s3:#527535; --s4:#af842c;
    --grid:#342c24; --axis:#4d4237;
    --hm-neg:#cf7757; --hm-pos:#7ea75e; --hm-mid:#3a322a; --hm-strong-text:#1c1612;
    --ord1:#964a2f; --ord2:#be6e51; --ord3:#e69275;
    --st-red:#e0675a; --st-yellow:#e2b14a; --st-green:#7fb66e;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1c1612; --bg-g1:rgba(217,138,108,.06); --bg-g2:rgba(157,179,138,.05);
  --paper:#26201a; --cream:#2f2720;
  --ink:#efe5d6; --ink-soft:#c2b4a2; --ink-mute:#988a7a;
  --line:#3d342b; --line-strong:#4d4237;
  --terra:#d98a6c; --terra-deep:#e8a58a; --sage:#9db38a; --sage-deep:#b5c9a3;
  --plum:#b5a5cc; --ochre:#d6b06a;
  --terra-wash:#3a2a22; --sage-wash:#2a3024; --ochre-wash:#3a3022; --plum-wash:#302a38;
  --btn:#d98a6c; --on-btn:#1c1612;
  --ok:#a7c793; --bad:#ec9a80;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.6);
  --s1:#b96648; --s2:#9a7cbd; --s3:#527535; --s4:#af842c;
  --grid:#342c24; --axis:#4d4237;
  --hm-neg:#cf7757; --hm-pos:#7ea75e; --hm-mid:#3a322a; --hm-strong-text:#1c1612;
  --ord1:#964a2f; --ord2:#be6e51; --ord3:#e69275;
  --st-red:#e0675a; --st-yellow:#e2b14a; --st-green:#7fb66e;
}

/* ───────── 바탕 ───────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  background-color:var(--bg);
  background-image:
    radial-gradient(1200px 700px at 8% -10%, var(--bg-g1), transparent 60%),
    radial-gradient(900px 600px at 105% 110%, var(--bg-g2), transparent 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.7;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all; overflow-wrap:anywhere;
}
img{max-width:100%}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.band{position:fixed;top:0;left:0;right:0;height:calc(5px + var(--sat));z-index:60;
  background:linear-gradient(90deg,var(--terra),var(--ochre) 34%,var(--sage) 67%,var(--plum));}

/* ───────── 앱 골격 ───────── */
.app{min-height:100vh;min-height:100dvh;padding-left:var(--sal);padding-right:var(--sar)}
.main{padding:calc(14px + var(--sat)) 16px calc(var(--tab-h) + 24px + var(--sab));max-width:940px;margin:0 auto}
.view{outline:none}
.app.wide .main{max-width:1180px}
.rail{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:4px calc(6px + var(--sar)) calc(4px + var(--sab)) calc(6px + var(--sal));
  background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line)}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-decoration:none;color:var(--ink-mute);font-size:12.5px;border-radius:12px;max-width:140px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--terra-deep);font-weight:700}
.tab.on svg{stroke-width:2.2}
body.focus .tabbar, body.focus .rail{display:none}
body.focus .main{padding-bottom:calc(110px + var(--sab))}

@media (min-width:1024px){
  .app{display:grid;grid-template-columns:232px 1fr}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;
    padding:calc(28px + var(--sat)) 14px 20px;border-right:1px solid var(--line);
    background:color-mix(in srgb,var(--paper) 60%,transparent)}
  .rail .brand{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.35;padding:4px 10px 14px;color:var(--ink)}
  .rail .brand small{display:block;font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--ink-mute);margin-top:4px}
  .rail a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;
    text-decoration:none;color:var(--ink-soft);font-size:15.5px}
  .rail a svg{width:21px;height:21px;flex:none}
  .rail a.on{background:var(--terra-wash);color:var(--terra-deep);font-weight:700}
  .rail .sep{height:1px;background:var(--line);margin:10px 8px}
  .tabbar{display:none}
  .main{padding-bottom:calc(40px + var(--sab));max-width:none;width:100%;padding-left:28px;padding-right:28px}
  .main > *{max-width:960px;margin-left:auto;margin-right:auto}
  .app.wide .main > *{max-width:1120px}
  body.focus .app{grid-template-columns:1fr}
}

/* ───────── 상단 바 ───────── */
.topbar{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:6px}
.topbar .title{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.01em}
.topbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-chip);padding:4px 11px;font-size:13px;white-space:nowrap;
  border:1px solid var(--line-strong);background:var(--cream);color:var(--ink-soft);min-height:30px}
button.pill{min-height:40px}
.pill svg{width:16px;height:16px;flex:none}
a{color:var(--terra-deep);text-underline-offset:3px}
.pill.warn{border-color:color-mix(in srgb,var(--ochre) 60%,transparent);background:var(--ochre-wash)}
@media (min-width:1024px){.topbar .title{display:none}}

/* ───────── 공통 타이포 ───────── */
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;line-height:1.35;margin:0}
.page-head{margin:6px 0 18px}
.page-head h1{font-size:28px}
.page-head p{margin:6px 0 0;color:var(--ink-soft);font-size:15.5px}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec .no{font-family:var(--serif);color:var(--terra);font-size:15px;white-space:nowrap}
.sec h2{font-size:21px}
.sec .aside{margin-left:auto;font-size:14px;color:var(--ink-mute)}
.orna{text-align:center;color:var(--ochre);letter-spacing:.6em;margin:30px 0 8px;font-size:14px;user-select:none}
.muted{color:var(--ink-mute)} .soft{color:var(--ink-soft)}
.small{font-size:14px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

/* ───────── 종이 카드 ───────── */
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sheet);
  box-shadow:var(--shadow);padding:20px 20px;overflow:hidden}
.sheet.banded::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,var(--terra),var(--ochre) 34%,var(--sage) 67%,var(--plum))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.stack > * + *{margin-top:12px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}

/* ───────── 버튼·칩 ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;white-space:nowrap;
  border-radius:12px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
  font-size:16px;font-weight:600;text-decoration:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.sage{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.quiet{background:var(--cream)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.big{min-height:56px;font-size:17px;padding:0 22px;border-radius:14px}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:0 13px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:var(--r-chip);
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-soft);font-size:15px;touch-action:manipulation}
.chip[aria-pressed="true"],.chip.on{background:var(--terra-wash);border-color:var(--terra);color:var(--terra-deep);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700}
.chip.part{border-style:dashed;border-color:var(--terra);color:var(--terra-deep)}
.chip .cnt{font-size:12.5px;color:var(--ink-mute);font-weight:400}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:var(--r-chip);font-size:12.5px;
  background:var(--cream);border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;line-height:1.7}
.tag.t{background:var(--terra-wash);border-color:transparent;color:var(--terra-deep)}
.tag.s{background:var(--sage-wash);border-color:transparent;color:var(--sage-deep)}
.tag.o{background:var(--ochre-wash);border-color:transparent;color:var(--ink-soft)}
.tag.p{background:var(--plum-wash);border-color:transparent;color:var(--ink-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink-soft);font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--terra-wash);color:var(--terra-deep);font-weight:700}

/* ───────── 미터 ───────── */
.meter{height:10px;border-radius:6px;background:color-mix(in srgb,var(--terra) 16%,var(--paper));overflow:hidden}
.meter > i{display:block;height:100%;border-radius:6px;background:var(--terra);min-width:0}
.meter.sage{background:color-mix(in srgb,var(--sage) 18%,var(--paper))}
.meter.sage > i{background:var(--sage)}
.meter.thin{height:6px}

/* ───────── 배너·알림 ───────── */
.banners:empty{display:none}
.banners{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:12px;
  background:var(--ochre-wash);border:1px solid color-mix(in srgb,var(--ochre) 40%,transparent);font-size:15px}
.banner.t{background:var(--terra-wash);border-color:color-mix(in srgb,var(--terra) 35%,transparent)}
.banner.s{background:var(--sage-wash);border-color:color-mix(in srgb,var(--sage) 35%,transparent)}
.banner .msg{flex:1;min-width:200px}
.banner b{font-weight:700}

/* ───────── 홈 ───────── */
.hero{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:700px){.hero{grid-template-columns:auto 1fr;align-items:center}}
.dday{font-family:var(--serif);font-size:56px;line-height:1;color:var(--terra-deep);font-weight:700;letter-spacing:-.02em}
.dday small{display:block;font-family:var(--sans);font-size:14px;color:var(--ink-mute);font-weight:400;letter-spacing:0;margin-top:8px}
.today-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:12px;background:var(--cream);border:1px solid var(--line)}
.stat .lbl{font-size:13.5px;color:var(--ink-soft)}
.stat .val{font-size:26px;font-weight:700;line-height:1.25;margin-top:2px}
.stat .val small{font-size:14px;font-weight:500;color:var(--ink-soft);margin-left:2px}
.stat .sub{font-size:13px;color:var(--ink-mute);margin-top:2px}
@media (max-width:520px){.today-grid{grid-template-columns:1fr 1fr}.today-grid .stat:first-child{grid-column:1/-1}}
.ready-list{display:grid;gap:8px}
.ready{display:grid;grid-template-columns:minmax(90px,1.1fr) auto minmax(80px,1.4fr) auto;gap:12px;align-items:center;
  padding:10px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.ready .u{font-family:var(--serif);font-weight:700}
.ready .sc{font-weight:700;min-width:3.2em;text-align:right}
@media (max-width:520px){.ready{grid-template-columns:1fr auto auto;row-gap:8px}.ready .meter{grid-column:1/-1;order:4}}
.signal{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;white-space:nowrap}
.signal svg{width:20px;height:20px;flex:none}
.signal.red{color:var(--st-red)} .signal.yellow{color:var(--st-yellow)} .signal.green{color:var(--st-green)}
.signal .t{color:var(--ink)}
.sets{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.sets{grid-template-columns:1fr 1fr}}
.setcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;border-radius:var(--r-card);
  background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.setcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--terra)}
.setcard.k-mock::before{background:var(--sage)} .setcard.k-boost::before{background:var(--ochre)}
.setcard h3{font-size:18.5px}
.setcard .sub{font-size:14px;color:var(--ink-soft);margin-top:2px}
.setcard .facts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:13px;color:var(--ink-mute)}
.setcard .facts b{display:block;font-size:16px;color:var(--ink);font-weight:700}
.setcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.setcard .acts .btn{flex:1}
.empty{padding:22px;border:1px dashed var(--line-strong);border-radius:var(--r-card);text-align:center;color:var(--ink-soft);background:color-mix(in srgb,var(--paper) 60%,transparent)}
.empty h3{font-size:18px;margin-bottom:6px;color:var(--ink)}
.resume{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--sage-wash);
  border:1px solid color-mix(in srgb,var(--sage) 35%,transparent)}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block;font-family:var(--serif)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.quick a{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);
  text-decoration:none;color:var(--ink);min-height:84px}
.quick a svg{width:24px;height:24px;color:var(--terra)}
.quick a span{font-size:13px;color:var(--ink-mute)}
.dl-box .meter{margin-top:8px}

/* ───────── 문항 ───────── */
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sheet);box-shadow:var(--shadow);padding:20px;position:relative}
.q + .q{margin-top:16px}
.q-head{display:flex;align-items:flex-start;gap:12px}
.q-num{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--terra);color:var(--paper);font-weight:700;font-size:16px;margin-top:1px}
.q-stem{flex:1;font-size:18px;font-weight:600;line-height:1.65}
.q-stem .pts{font-weight:400;color:var(--ink-mute);font-size:14.5px;margin-left:4px;white-space:nowrap}
.q-meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 50px}
.flag{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center;color:var(--ink-mute);font-size:22px;line-height:1}
.flag[aria-pressed="true"]{color:var(--ochre);background:var(--ochre-wash);border-color:var(--ochre)}
.q-body{margin-top:14px}
.q-cols{display:grid;gap:16px;grid-template-columns:1fr}
.passage{font-family:var(--serif);font-size:16.5px;line-height:2;padding:14px 16px;border-left:4px solid var(--terra);
  background:color-mix(in srgb,var(--cream) 70%,var(--paper));border-radius:0 12px 12px 0}
.passage p,.rich p{margin:0 0 .5em}
.passage p:last-child,.rich p:last-child{margin-bottom:0}
.rich .bogi,.passage .bogi{position:relative;border:1px solid var(--line-strong);border-radius:10px;padding:18px 14px 10px;margin:12px 0 6px;background:var(--paper)}
.rich .bogi::before,.passage .bogi::before{content:"보기";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  background:var(--paper);padding:0 10px;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:999px;line-height:20px}
.rich .box,.passage .box{border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;margin:8px 0;background:var(--paper)}
.rich .src,.passage .src{font-size:13px;color:var(--ink-mute);text-align:right;margin-top:6px;font-family:var(--sans)}
.rich table.tbl,.passage table.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px;line-height:1.6;font-family:var(--sans)}
.tbl th,.tbl td{border:1px solid var(--line-strong);padding:7px 9px;vertical-align:top;text-align:left}
.tbl th{background:var(--cream);font-weight:700}
.talk{margin:0 0 .45em}
.talk .who{display:inline-block;min-width:3em;font-weight:700;font-family:var(--sans);font-size:14px;color:var(--terra-deep);
  margin-right:8px;padding:0 8px;border-radius:6px;background:var(--terra-wash)}
.fig{margin:0;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:8px;text-align:center}
.fig button{display:block;width:100%;border:0;background:transparent;padding:0;cursor:zoom-in}
.fig img{display:block;margin:0 auto;max-height:520px;width:auto;max-width:100%;border-radius:6px;background:#fff}
.fig figcaption{font-size:13px;color:var(--ink-mute);margin-top:6px}
.choices{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:52px;padding:11px 14px;text-align:left;
  border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:16.5px;line-height:1.6;touch-action:manipulation}
.choice .cn{flex:none;font-size:19px;line-height:1.35;color:var(--ink-soft);min-width:1.2em}
.choice .ct{flex:1}
.choice[aria-checked="true"]{border-color:var(--terra);background:var(--terra-wash)}
.choice[aria-checked="true"] .cn{color:var(--terra-deep);font-weight:700}
.choice:disabled{cursor:default;opacity:1}
.choice.is-ans{border-color:var(--sage);background:var(--sage-wash)}
.choice.is-wrong{border-color:var(--bad);background:color-mix(in srgb,var(--terra-wash) 70%,var(--paper))}
.choice .mark{flex:none;font-size:13px;font-weight:700;padding:1px 8px;border-radius:999px;align-self:center}
.choice.is-ans .mark{background:var(--sage-deep);color:var(--paper)}
.choice.is-wrong .mark{background:var(--bad);color:var(--paper)}
.reason{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:4px;line-height:1.6}
.short-in{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.short-in label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.short-in .bl{font-weight:700;color:var(--terra-deep);min-width:2.2em}
.inp{min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--paper);font-size:17px;flex:1;min-width:0;width:100%}
.inp:focus{border-color:var(--terra);outline:none}
textarea.inp{min-height:230px;line-height:1.8;resize:vertical;font-family:var(--sans)}
.essay-hint{font-size:13.5px;color:var(--ink-mute);margin:6px 2px 0}
.fb{margin-top:16px;border-top:1px dashed var(--line-strong);padding-top:14px}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)} .verdict.pend{color:var(--ochre)}
.verdict svg{width:22px;height:22px}
.exp{font-family:var(--serif);font-size:16px;line-height:1.95;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-top:10px}
.kv dt{color:var(--ink-mute)} .kv dd{margin:0;font-weight:600}
.trap{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--ochre-wash);font-size:15px}
.trap b{color:var(--terra-deep)}
.related{margin-top:12px;padding:12px;border-radius:12px;background:var(--plum-wash)}
.related h4{margin:0 0 8px;font-size:15px;font-family:var(--serif)}
.related .rel-list{display:flex;flex-wrap:wrap;gap:8px}
.rubric{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.rubric label{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);min-height:48px}
.rubric input{width:24px;height:24px;flex:none;accent-color:var(--sage-deep);margin-top:2px}
.rubric .pt{margin-left:auto;font-weight:700;white-space:nowrap}
.model{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--sage-wash);font-family:var(--serif);line-height:1.9}
.my-essay{white-space:pre-wrap;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--cream);font-size:15.5px}

/* 풀이 화면 */
.solve-top{position:sticky;top:calc(5px + var(--sat));z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 16px;margin:-6px -16px 10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.solve-top .ttl{flex:1;min-width:0;font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--cream);border:1px solid var(--line-strong);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.timer.low{background:var(--terra-wash);border-color:var(--terra);color:var(--terra-deep)}
.qnav{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.qnav::-webkit-scrollbar{display:none}
.qn{position:relative;flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--paper);
  font-weight:700;font-size:15px;color:var(--ink-soft);touch-action:manipulation}
.qn.done{background:var(--cream);color:var(--ink);border-color:var(--ink-mute)}
.qn.cur{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra) inset;color:var(--terra-deep)}
.qn.ok{background:var(--sage-wash);border-color:var(--sage)}
.qn.no{background:var(--terra-wash);border-color:var(--bad)}
.qn .st{position:absolute;top:-7px;right:-5px;font-size:14px;color:var(--ochre)}
.qn .rs{position:absolute;bottom:-3px;right:2px;font-size:11px}
.solve-layout{display:block}
.qnav-side{display:none}
.solve-bottom{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px calc(16px + var(--sar)) calc(10px + var(--sab)) calc(16px + var(--sal));
  background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.solve-bottom .in{display:flex;gap:10px;max-width:960px;margin:0 auto;align-items:center}
.solve-bottom .btn{flex:1}
.solve-bottom .btn.nav{flex:0 0 auto;min-width:96px}
.legend-mini{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-mute);margin:-4px 0 8px}
@media (min-width:1024px){.solve-top{margin:-6px -28px 10px;padding:8px 28px}}
@media (min-width:1024px) and (orientation:landscape){
  .solve-layout{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
  .qnav{display:none}
  .qnav-side{display:block;position:sticky;top:calc(70px + var(--sat));padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
  .qnav-side .grid{display:grid;grid-template-columns:repeat(3,44px);gap:8px;justify-content:center}
  .qnav-side h4{margin:0 0 10px;font-size:14px;font-family:var(--serif)}
  .q.has-side .q-cols{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .q.has-side .q-cols .col-a{position:sticky;top:calc(80px + var(--sat))}
  .solve-bottom{left:0}
}

/* 결과 */
.score-head{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.score-head{grid-template-columns:auto 1fr;align-items:center}}
.big-score{font-size:52px;font-weight:700;line-height:1;color:var(--terra-deep)}
.big-score small{font-size:18px;color:var(--ink-soft);font-weight:500;margin-left:4px}
details.rv{border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);box-shadow:var(--shadow)}
details.rv + details.rv{margin-top:10px}
details.rv > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;cursor:pointer}
details.rv > summary::-webkit-details-marker{display:none}
details.rv > summary .sum-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15.5px}
details.rv > summary .chev{transition:transform .2s;color:var(--ink-mute)}
details.rv[open] > summary .chev{transform:rotate(90deg)}
details.rv[open] > summary .sum-t{visibility:hidden}
details.rv > .rv-body{padding:0 14px 16px}
details.rv > .rv-body > .q{box-shadow:none;border:0;padding:4px 0 0}
.res-ic{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--paper);font-size:15px}
.res-ic.ok{background:var(--sage-deep)} .res-ic.no{background:var(--bad)} .res-ic.pend{background:var(--ochre)} .res-ic.skip{background:var(--ink-mute)}

/* 오답 노트·지도 */
.cgroup{border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);padding:14px;}
.cgroup + .cgroup{margin-top:12px}
.cgroup.rep{border-color:color-mix(in srgb,var(--terra) 55%,transparent);box-shadow:inset 4px 0 0 var(--terra)}
.cgroup h3{font-size:17px}
.mapu{border:1px solid var(--line);border-radius:var(--r-sheet);background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.mapu + .mapu{margin-top:14px}
.mapu > summary,.mapt > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 16px}
.mapu > summary::-webkit-details-marker,.mapt > summary::-webkit-details-marker{display:none}
.mapu > summary h2{font-size:19px;flex:1}
.mapt{border-top:1px solid var(--line)}
.mapt > summary{padding-left:22px;font-weight:700}
.mapt > summary .tn{flex:1}
.crow{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 16px 8px 30px;border:0;border-top:1px solid var(--line);
  background:transparent;text-align:left;font-size:15.5px}
.crow:hover{background:var(--cream)}
.crow .cn{flex:1;min-width:0}
.crow .cn small{display:block;color:var(--ink-mute);font-size:12.5px}
.cst{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;white-space:nowrap;min-width:5.6em}
.cst svg{width:18px;height:18px;flex:none}
.cst.m{color:var(--st-green)} .cst.p{color:var(--ochre)} .cst.n{color:var(--ink-mute)}
.cst .t{color:var(--ink)}
.chev{display:inline-block;transition:transform .2s}
details[open] > summary > .chev{transform:rotate(90deg)}

/* 맞춤 문제 */
.form-sec{padding:16px;border-radius:var(--r-card);background:var(--paper);border:1px solid var(--line)}
.form-sec + .form-sec{margin-top:12px}
.form-sec h3{font-size:17px;display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.form-sec h3 .no{font-size:14px;color:var(--terra);font-weight:400}
.unitbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.unitbox + .unitbox{margin-top:8px}
.unitbox .topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-left:4px}
.radio-list{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:700px){.radio-list{grid-template-columns:1fr 1fr}}
.radio{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);min-height:48px;background:var(--paper)}
.radio input[type=radio],.radio input[type=checkbox]{width:22px;height:22px;accent-color:var(--terra-deep);flex:none;margin-top:2px}
.radio .num-in{min-height:44px;padding:6px 10px}
.radio small{display:block;color:var(--ink-mute);font-size:13px}
.radio:has(input:checked){border-color:var(--terra);background:var(--terra-wash)}
.count-bar{position:sticky;bottom:calc(var(--tab-h) + 8px + var(--sab));z-index:20;margin-top:16px;padding:12px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--paper) 96%,transparent);border:1px solid var(--line-strong);box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (min-width:1024px){.count-bar{bottom:12px}}
.count-bar .n{font-size:18px;font-weight:700}
.count-bar .warn{margin-top:8px;font-size:14.5px;color:var(--bad)}
.relax{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@media (max-width:620px){
  .count-bar .row > .spacer{flex-basis:100%}
  .count-bar .row > .btn{flex:1}
  .count-bar .warn{font-size:13.5px}
  .relax{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .relax::-webkit-scrollbar{display:none}
  .relax .chip{flex:none}
  .solve-bottom .btn.nav{min-width:68px;padding:0 12px}
  .solve-bottom .btn{padding:0 12px;font-size:15.5px}
}
.myset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.myset + .myset{margin-top:8px}
.myset .nm{flex:1;min-width:140px;font-weight:700}
.myset .nm small{display:block;font-weight:400;color:var(--ink-mute);font-size:12.5px}
.automock{background:linear-gradient(135deg,var(--sage-wash),var(--paper) 70%)}
.num-in{width:90px;flex:none;min-height:44px;text-align:center}

/* ───────── 대시보드 ───────── */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:calc(5px + var(--sat));z-index:25;padding:8px 0;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:14px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.kpi .lbl{font-size:13.5px;color:var(--ink-soft)}
.kpi .val{font-size:30px;font-weight:700;line-height:1.2;margin-top:2px;font-family:var(--sans)}
.kpi .val small{font-size:15px;font-weight:500;color:var(--ink-soft);margin-left:2px}
.kpi .sub{font-size:12.5px;color:var(--ink-mute)}
.dgrid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:14px}
@media (min-width:1024px){.dgrid.two{grid-template-columns:1fr 1fr}}
figure.chart{margin:0;padding:16px;border-radius:var(--r-card);background:var(--paper);border:1px solid var(--line);min-width:0}
figure.chart > header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
figure.chart > header .h{flex:1;min-width:0}
figure.chart h3{font-size:17px}
figure.chart .cap{font-size:13.5px;color:var(--ink-mute);margin-top:2px;font-family:var(--sans)}
figure.chart .tbl-toggle{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--cream);font-size:13.5px;color:var(--ink-soft)}
figure.chart .plot{position:relative;width:100%;overflow:hidden}
figure.chart .plot svg{display:block;width:100%;height:auto;overflow:visible}
figure.chart .tblwrap{overflow-x:auto;margin-top:6px}
figure.chart table.data{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
figure.chart table.data th,figure.chart table.data td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
figure.chart table.data th{color:var(--ink-soft);font-weight:700;background:var(--cream)}
figure.chart .nodata{padding:18px 6px;text-align:center;color:var(--ink-mute);font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:3px;border-radius:2px;width:16px;vertical-align:3px}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .ax{stroke:var(--axis);stroke-width:1}
svg text{font-family:var(--sans);fill:var(--ink-mute);font-size:12px}
svg text.lab{fill:var(--ink-soft);font-size:13px}
svg text.val{fill:var(--ink);font-size:12.5px;font-weight:700}
svg text.strong{fill:var(--ink)}
svg .hit{fill:transparent;cursor:pointer}
svg .mk{transition:opacity .15s}
svg .hov .mk, svg .mk.hov{opacity:.75}
svg .hmcell{stroke:var(--paper);stroke-width:2}
svg .hmcell.empty{fill:transparent;stroke:var(--line);stroke-width:1}
.tooltip{position:fixed;z-index:90;pointer-events:none;min-width:120px;max-width:260px;padding:9px 12px;border-radius:10px;background:var(--paper);
  border:1px solid var(--line-strong);box-shadow:0 8px 24px -10px rgba(0,0,0,.35);font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
.tooltip .tv{font-size:16px;font-weight:700;color:var(--ink)}
.tooltip .tr{display:flex;align-items:center;gap:8px}
.tooltip .tr i{display:inline-block;width:14px;height:3px;border-radius:2px}
.ttable{width:100%;border-collapse:collapse;font-size:14.5px}
.ttable th,.ttable td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ttable th{font-size:13px;color:var(--ink-soft);font-weight:700;background:var(--cream)}
.ttable td.r,.ttable th.r{text-align:right;font-variant-numeric:tabular-nums}
.ttable td,.ttable th{white-space:nowrap}
@media (max-width:520px){.ttable th,.ttable td{padding:7px 5px;font-size:13.5px}}
.wlist{display:flex;flex-direction:column;gap:6px}
.witem{display:grid;grid-template-columns:1.6em minmax(0,1fr) 120px 4.2em;gap:10px;align-items:center;font-size:14.5px;min-height:40px}
.witem .rk{color:var(--ink-mute);font-weight:700;text-align:right}
.witem .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.witem .nm small{color:var(--ink-mute);margin-left:6px}
.witem .pc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.witem{grid-template-columns:1.6em minmax(0,1fr) 4.2em}.witem .meter{display:none}}

/* ───────── 모달·토스트·확대 ───────── */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(40,30,22,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(12px + var(--sat)) 12px 0}
@media (min-width:700px){.modal-back{align-items:center;padding:24px}}
.modal{position:relative;width:100%;max-width:620px;max-height:calc(100dvh - 24px - var(--sat));overflow:auto;background:var(--paper);
  border-radius:20px 20px 0 0;padding:24px 20px calc(18px + var(--sab));box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
@media (min-width:700px){.modal{border-radius:20px;max-height:calc(100dvh - 48px)}}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--terra),var(--ochre) 34%,var(--sage) 67%,var(--plum))}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .m-body{font-size:16px}
.modal .m-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.modal .m-acts .btn{flex:1;min-width:120px}
.modal .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink-mute);font-size:22px}

<script>
(function(){'use strict';

  const el = document.createElement(tag);

    for (const k in attrs) {
      const v = attrs[k];
      if (k.startsWith('aria-') && typeof v === 'boolean') { el.setAttribute(k, String(v)); continue; }

      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);

}

}
function esc(s) {

/* ---- 날짜 (기기 현지 날짜 기준) ---- */
const pad2 = n => String(n).padStart(2, '0');
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function keyToUTC(k) { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function dayDiff(a, b) { return Math.round((keyToUTC(a) - keyToUTC(b)) / 86400000); } // a - b (일)
function addDays(k, n) { const t = new Date(keyToUTC(k) + n * 86400000); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate()); }
function weekStartKey(now) { const k = dayKey(now); const wd = new Date(now).getDay(); return addDays(k, -((wd + 6) % 7)); } // 월요일 시작
function fmtDay(k) { if (!k) return ''; const [, m, d] = k.split('-').map(Number); return m + '월 ' + d + '일'; }
function fmtShortDay(k) { const [, m, d] = k.split('-').map(Number); return m + '/' + d; }
function fmtDateTime(ts) { const d = new Date(ts); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function relDay(ts, now) {
  if (!ts) return '';
  const dd = dayDiff(dayKey(now || Date.now()), dayKey(ts));
  if (dd <= 0) return '오늘'; if (dd === 1) return '어제'; if (dd < 7) return dd + '일 전';
  return fmtDay(dayKey(ts));
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return sec + '초';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return m + '분' + (s && m < 10 ? ' ' + s + '초' : '');
  const hh = Math.floor(m / 60), mm = m % 60;
  return hh + '시간' + (mm ? ' ' + mm + '분' : '');
}
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return pad2(m) + ':' + pad2(s); }
const pct = x => Math.round((x || 0) * 100 + 1e-9);

/* ---- 그 밖 ---- */
function uid(p) { return (p || 's') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uniq(a) { return Array.from(new Set(a)); }
function groupBy(arr, fn) { const m = new Map(); for (const x of arr) { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function stripTags(html) { const d = document.createElement('div'); d.innerHTML = sanitize(html || ''); return d.textContent.replace(/\s+/g, ' ').trim(); }

const ORD = ['하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열', '열하나', '열둘', '열셋', '열넷'];
const CIRC = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];
const METHODS = {
  A: '옳은/옳지 않은 진술', B: '〈보기〉 합답형', C: '빈칸·밑줄 추론', D: '비교표 판정', E: '사례 적용',
  F: '교사-학생 문답', G: '그래프·지도·통계 해석', H: '원문 자료', I: '순서 배열', J: '오류 찾기',
  K: '도식 빈칸', L: '단답형', M: '개념 서술형', N: '자료 근거 서술형', O: '조건 서술형'
};
const METHOD_KEYS = Object.keys(METHODS);
const METHOD_GROUPS = [
  { key: 'concept', name: '개념 확인형', methods: ['A', 'C', 'L'] },

];

const DIFFS = ['하', '중', '상'];
const MODES = { round: '회차', custom: '맞춤 세트', mock: '실전 모의', boost: '보강 세트' };
const KIND_ORDER = ['round', 'mock', 'boost'];

/* ---- 문항 HTML 정리: script·on*·style·외부 링크 제거 ---- */
const ALLOWED_TAGS = new Set(['P', 'BR', 'U', 'B', 'STRONG', 'I', 'EM', 'DIV', 'SPAN', 'TABLE', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TH', 'TD',
  'SUP', 'SUB', 'SMALL', 'UL', 'OL', 'LI', 'IMG', 'CAPTION', 'COLGROUP', 'COL', 'MARK', 'S', 'DEL', 'INS', 'HR', 'BLOCKQUOTE']);
const DROP_TAGS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'BASE', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'SVG', 'MATH', 'TEMPLATE', 'NOSCRIPT', 'AUDIO', 'VIDEO', 'SOURCE', 'FRAME', 'FRAMESET']);
const ALLOWED_ATTR = new Set(['class', 'colspan', 'rowspan', 'src', 'alt', 'width', 'height']);
function sanitize(html) {
  if (html == null) return '';
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html);
  const walk = (node) => {
    for (const ch of Array.from(node.childNodes)) {
      if (ch.nodeType === 1) {
        const tag = ch.tagName.toUpperCase();
        if (DROP_TAGS.has(tag)) { ch.remove(); continue; }

          walk(ch);
          while (ch.firstChild) node.insertBefore(ch.firstChild, ch);
          ch.remove(); continue;
        }
        for (const at of Array.from(ch.attributes)) {
          const n = at.name.toLowerCase();

/* ===================== 10 저장소 (localStorage, 키 앞머리 t2r:v1:) ===================== */
const PREFIX = 't2r:v1:';
const DEFAULT_SETTINGS = {
  examDate: null, dailyGoal: 20, targetRate: 80, mySets: [],
  lastBackupAt: null, attemptsAtLastBackup: 0, lastManifestVersion: null, knownSets: [],

  set(key, val) {

let storeWarned = false;

}

const DB = { attempts: [], sittings: [], settings: { ...DEFAULT_SETTINGS }, flags: {}, progress: {} };
function arr(x) { return Array.isArray(x) ? x : []; }
function obj(x) { return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }
function loadDB() {

const saveSittings = () => store.set('sittings', DB.sittings);

/* ===================== 20 데이터 로딩 ===================== */
const DATA = {

async function fetchJSON(path, opts) {

function normManifest(m) {
  m = obj(m);

async function loadUnits() {

function normItem(raw, set) {
  const it = { ...raw };

  it.method = METHODS[raw.method] ? raw.method : (it.type === 'essay' ? 'M' : it.type === 'short' ? 'L' : 'A');

  it.image = raw.image || null; it.imageCaption = raw.imageCaption || '';
  it.choices = arr(raw.choices); it.wrongReasons = arr(raw.wrongReasons);
  it.accept = arr(raw.accept).map(String);
  it.blanks = arr(raw.blanks).filter(b => b && Array.isArray(b.accept)).map((b, i) => ({ label: String(b.label || ('(' + (i + 1) + ')')), accept: b.accept.map(String) }));
  if (it.type === 'short' && !it.accept.length && raw.answer != null && !it.blanks.length) it.accept = [String(raw.answer)];
  it.rubric = arr(raw.rubric).filter(r => r).map(r => ({ criterion: String(r.criterion || r.기준 || ''), points: Number(r.points != null ? r.points : r.배점) || 0 }));
  it.modelAnswer = raw.modelAnswer || '';
  it.explanation = raw.explanation || ''; it.pages = raw.pages != null ? String(raw.pages) : ''; it.trap = raw.trap || '';
  it.answer = raw.answer;
  if (it.type === 'mc') it.answer = Number(raw.answer) || 0;
  const rubricSum = it.rubric.reduce((s, r) => s + r.points, 0);
  it.points = Number(raw.points) > 0 ? Number(raw.points) : (it.type === 'essay' ? (rubricSum || 1) : 1);
  it.maxScore = it.type === 'essay' ? (rubricSum || it.points) : it.points;
  it.setId = set.id; it.setKind = set.kind; it.setTitle = set.title;

function registerSet(raw, meta) {
  const set = {
    id: String(raw.id || meta.id), kind: meta.kind || raw.kind || 'other', unit: raw.unit != null ? raw.unit : meta.unit,
    units: arr(raw.units).length ? arr(raw.units) : meta.units, round: raw.round != null ? raw.round : meta.round,
    title: raw.title || meta.title, subtitle: raw.subtitle || meta.subtitle || '', order: meta.order,
    timeLimitMin: raw.timeLimitMin || meta.timeLimitMin || null, itemIds: []

/* ===================== 30 지표 계산 (순수 함수: 검산용으로 window.T2R.calc에 노출) ===================== */
const calc = {
  sorted(atts) { return atts.slice().sort((a, b) => (a.at || 0) - (b.at || 0)); },
  accuracy(atts) {
    const n = atts.length, c = atts.filter(a => a.correct).length;
    return { n, correct: c, rate: n ? c / n : null };
  },
  /** 진도율 = 한 번 이상 푼 서로 다른 문항 수 ÷ 대상 문항 수 */
  progress(atts, itemIds) {
    const all = new Set(itemIds);
    const done = new Set();
    for (const a of atts) if (all.has(a.itemId)) done.add(a.itemId);
    return { done: done.size, total: all.size, rate: all.size ? done.size / all.size : 0 };
  },
  /** 개념 상태: 최근 3번 중 2번 이상 정답 + 마지막 정답 + 정답 method 2가지 이상 → 정복 */
  conceptState(attsOfConcept) {
    if (!attsOfConcept || !attsOfConcept.length) return 'none';
    const s = calc.sorted(attsOfConcept);
    const last3 = s.slice(-3);
    const ok3 = last3.filter(a => a.correct).length;
    const lastOk = !!s[s.length - 1].correct;
    const methods = new Set(s.filter(a => a.correct).map(a => a.method));
    return (ok3 >= 2 && lastOk && methods.size >= 2) ? 'mastered' : 'progress';
  },
  mastery(atts, conceptIds) {
    const by = groupBy(atts, a => a.conceptId);
    const states = {};
    let mastered = 0, progress = 0;
    for (const cid of conceptIds) {
      const st = calc.conceptState(by.get(cid) || []);
      states[cid] = st;
      if (st === 'mastered') mastered++; else if (st === 'progress') progress++;
    }
    const total = conceptIds.length;
    return { mastered, progress, none: total - mastered - progress, total, rate: total ? mastered / total : 0, states };
  },
  /** 시험 준비도(0~100) = 0.4 × 진도율 + 0.6 × 개념 정복률 */
  readiness(progressRate, masteryRate) { return Math.round(100 * (0.4 * (progressRate || 0) + 0.6 * (masteryRate || 0)) * 1e9) / 1e9; },
  signal(score) { return score >= 80 ? 'green' : score >= 60 ? 'yellow' : 'red'; },
  /** 오늘의 목표: 오늘 푼 문항 수(시도 수) ÷ 하루 목표(최대 100%), 오늘 정답률 ≥ 목표 정답률이면 달성 */
  today(atts, dailyGoal, targetRate, now) {
    const k = dayKey(now);
    const t = atts.filter(a => dayKey(a.at) === k);
    const c = t.filter(a => a.correct).length;
    const goal = Math.max(1, Number(dailyGoal) || 1);
    const rate = t.length ? c / t.length : null;
    return {
      count: t.length, correct: c, goal, ratio: Math.min(1, t.length / goal), rate,
      rateOk: rate != null && rate * 100 >= (Number(targetRate) || 0), countOk: t.length >= goal
    };
  },
  /** 연속 학습일: 오늘(오늘 기록이 없으면 어제)부터 거꾸로 이어진 날 수 */
  streak(atts, now) {
    const days = new Set(atts.map(a => dayKey(a.at)));
    let k = dayKey(now);
    if (!days.has(k)) k = addDays(k, -1);
    let n = 0;
    while (days.has(k)) { n++; k = addDays(k, -1); }
    return n;
  },
  studyDays(atts) { return new Set(atts.map(a => dayKey(a.at))).size; },
  /** D-day: 남은 날 = 시험일 - 오늘 (오늘 포함·시험 당일 제외, 최소 1). 하루 권장량 = 안 푼 문항 ÷ 남은 날, 올림 */
  dday(examDate, now, unsolved) {
    if (!examDate || !/^\d{4}-\d{2}-\d{2}$/.test(examDate)) return null;
    const d = dayDiff(examDate, dayKey(now));
    const daysLeft = Math.max(1, d);
    return { d, daysLeft, unsolved, perDay: Math.ceil((unsolved || 0) / daysLeft) };
  },
  conceptStats(atts) {
    const m = new Map();
    for (const a of calc.sorted(atts)) {
      let s = m.get(a.conceptId);
      if (!s) { s = { conceptId: a.conceptId, n: 0, correct: 0, wrong: 0, time: 0, methods: new Set(), lastAt: 0, unit: a.unit, topic: a.topic }; m.set(a.conceptId, s); }
      s.n++; if (a.correct) { s.correct++; s.methods.add(a.method); } else s.wrong++;
      s.time += Number(a.timeSec) || 0; s.lastAt = a.at;
    }
    for (const s of m.values()) s.rate = s.n ? s.correct / s.n : null;
    return m;
  },
  /** 약점 개념: 시도 2회 이상, 정답률 낮은 순 */
  weakConcepts(atts, limit) {
    return Array.from(calc.conceptStats(atts).values()).filter(s => s.n >= 2)
      .sort((a, b) => a.rate - b.rate || b.n - a.n || (a.conceptId < b.conceptId ? -1 : 1)).slice(0, limit || 10);
  },
  repeatWrong(atts) {
    return Array.from(calc.conceptStats(atts).values()).filter(s => s.wrong >= 2)
      .sort((a, b) => b.wrong - a.wrong || a.rate - b.rate);
  },
  /** 단답형 채점: 공백·가운뎃점·쉼표·마침표·괄호·「」 제거, 소문자 */
  norm(s) {
    return String(s == null ? '' : s).normalize('NFC').toLowerCase()
      .replace(/[\s·‧∙•ㆍ・,，.。()\[\]（）「」『』]/g, '');
  },
  gradeShort(item, input) {
    if (item.blanks && item.blanks.length) {
      const vals = Array.isArray(input) ? input : [input];
      const hits = item.blanks.map((b, i) => b.accept.some(x => calc.norm(x) === calc.norm(vals[i])) && calc.norm(vals[i]) !== '');
      const k = hits.filter(Boolean).length;
      return { correct: k === item.blanks.length, score: item.points * k / item.blanks.length, maxScore: item.points, hits };
    }
    const v = calc.norm(Array.isArray(input) ? input[0] : input);
    const ok = v !== '' && item.accept.some(x => calc.norm(x) === v);
    return { correct: ok, score: ok ? item.points : 0, maxScore: item.points };
  },
  gradeEssay(item, checks) {
    const max = item.rubric.reduce((s, r) => s + r.points, 0) || item.points;
    const score = item.rubric.reduce((s, r, i) => s + (checks && checks[i] ? r.points : 0), 0);
    return { correct: score >= max * 0.7 - 1e-9, score, maxScore: max };
  }
};

/* ---- 앱 상태 위에서 돌아가는 지표 ---- */
const metrics = {
  unitItemIds(u) { return bankItems().filter(it => it.unit === u).map(it => it.id); },
  unitStats(u, atts) {
    atts = atts || DB.attempts;
    const ids = metrics.unitItemIds(u);
    const cids = arr((DATA.units[u] || {}).concepts).map(c => c.conceptId);
    const p = calc.progress(atts, ids);
    const m = calc.mastery(atts.filter(a => a.unit === u), cids);
    const score = calc.readiness(p.rate, m.rate);
    return { unit: u, progress: p, mastery: m, readiness: score, signal: calc.signal(score) };
  },
  /** 홈 화면용: 문제은행을 다 불러오지 않아도 manifest의 count로 근사 */
  unitStatsLite(u) {
    const sets = DATA.setList.filter(s => s.unit === u || (s.units.length === 1 && s.units[0] === u));
    const total = sets.reduce((s, x) => s + x.count, 0);
    const done = new Set(DB.attempts.filter(a => a.unit === u).map(a => a.itemId)).size;
    const cids = arr((DATA.units[u] || {}).concepts).map(c => c.conceptId);
    const m = calc.mastery(DB.attempts.filter(a => a.unit === u), cids);
    const pr = total ? Math.min(1, done / total) : 0;
    const score = calc.readiness(pr, m.rate);
    return { unit: u, progress: { done, total, rate: pr }, mastery: m, readiness: score, signal: calc.signal(score) };
  },
  totalItemCount() {
    if (DATA.bankLoaded) return bankItems().length;
    return DATA.setList.reduce((s, x) => s + x.count, 0);
  },
  unsolvedCount() {
    const done = new Set(DB.attempts.map(a => a.itemId));
    if (DATA.bankLoaded) return bankItems().filter(it => !done.has(it.id)).length;
    return Math.max(0, metrics.totalItemCount() - done.size);
  },
  setProgress(setId) {
    const meta = DATA.setMeta[setId];
    const set = DATA.sets[setId];
    const atts = DB.attempts.filter(a => a.setId === setId);
    const done = set ? calc.progress(atts, set.itemIds).done : new Set(atts.map(a => a.itemId)).size;
    const total = set ? set.itemIds.length : (meta ? meta.count : 0);
    const sits = DB.sittings.filter(s => s.setId === setId && s.done && s.maxScore > 0);
    const best = sits.length ? Math.max(...sits.map(s => s.score / s.maxScore)) : null;
    const last = atts.length ? atts[atts.length - 1].at : null;
    return { done, total, rate: total ? Math.min(1, done / total) : 0, best, last, sittings: sits.length };
  },
  itemHistory(itemId) { return DB.attempts.filter(a => a.itemId === itemId); },
  conceptStateOf(cid) { return calc.conceptState(DB.attempts.filter(a => a.conceptId === cid)); }
};

const DL = { running: false, done: 0, total: 0, failed: 0, listeners: new Set() };
function dlNotify() { for (const f of DL.listeners) try { f(DL); } catch (e) { /* 무시 */ } }
function offlineUrls(m) {
  return uniq(['./', 'index.html', 'manifest.webmanifest', 'icon-180.png', 'icon-192.png', 'icon-512.png', 'icon-maskable-512.png',
    'data/manifest.json', m.guide, ...m.units.map(u => u.file), ...m.sets.map(s => s.file), ...m.images].filter(Boolean));
}
async function startDownload() {
  if (DL.running) return;

  try {
    const m = await loadManifest();
    if (!m) throw new Error('manifest');

        if (d.type === 'progress') { DL.done = d.done; DL.failed = d.failed; DL.total = d.total; dlNotify(); }
        if (d.type === 'done') { DL.done = d.done; DL.failed = d.failed; resolve(); }
      };
      sw.postMessage({ type: 'precache', urls }, [ch.port2]);
    });

    else { DB.settings.offlineVersion = m.version; DB.settings.offlineAt = Date.now(); saveSettings(); toast('인터넷 없이도 풀 수 있게 준비했어요.'); }
  } catch (e) {
    toast('내려받기에 실패했어요. 인터넷 연결을 확인해 주세요.', 3500);
  } finally {

  }

function openZoom(src) {
  const z = $('#zoom'), img = $('#zoom-img');

/* ===================== 75 맞춤 문제 만들기 · 실전 모의 자동 구성 ===================== */
const BASIS = [
  ['all', '전체 무작위', '조건에 맞는 문항에서 고루 뽑아요'],
  ['unsolved', '안 푼 문항만', '한 번도 안 푼 문항'],
  ['wrong', '틀린 문항만', '가장 최근에 틀린 문항'],
  ['flagged', '★ 문항만', '헷갈림 표시한 문항'],
  ['weak', '약점 개념 우선', '정답률 낮은 개념부터 채워요'],
  ['unmastered', '정복 못 한 개념만', '아직 정복하지 못한 개념의 문항']

const DIM_LABEL = { scope: '범위(단원·주제)', rounds: '회차', diffs: '난이도', methods: '문제 유형', types: '문항 형식', basis: '출제 기준' };
const CUSTOM_UI = { c: null, detail: false };
function allTopicKeys() {
  const keys = [];
  for (const u of DATA.unitList) for (const t of arr((DATA.units[u.unit] || {}).topics)) keys.push(u.unit + '-' + Number(t.topic));
  for (const it of bankItems()) keys.push(it.unit + '-' + it.topic);

}
function allRoundKeys() { return uniq(bankItems().map(it => it.round == null ? 'x' : String(it.round))).sort(); }
function defaultCriteria() {
  return { topics: allTopicKeys(), rounds: allRoundKeys(), diffs: DIFFS.slice(), methods: METHOD_KEYS.slice(), types: ['mc', 'short', 'essay'],
    count: 10, basis: 'all', grade: DB.settings.gradeMode || 'instant', timer: 'none', perItemSec: 90, totalMin: 15 };
}
function normCriteria(c) {
  const d = defaultCriteria(); c = obj(c);
  const out = { ...d, ...c };
  for (const k of ['topics', 'rounds', 'diffs', 'methods', 'types']) out[k] = Array.isArray(c[k]) ? c[k].map(String) : d[k];
  out.count = clamp(parseInt(out.count, 10) || 10, 1, 200);
  if (!BASIS.some(b => b[0] === out.basis)) out.basis = 'all';
  return out;
}
function itemsAttemptMap() { return groupBy(DB.attempts, a => a.itemId); }
function baseMatch(c, skip) {
  return bankItems().filter(it =>
    (skip === 'scope' || c.topics.includes(it.unit + '-' + it.topic)) &&
    (skip === 'rounds' || c.rounds.includes(it.round == null ? 'x' : String(it.round))) &&
    (skip === 'diffs' || c.diffs.includes(it.difficulty)) &&
    (skip === 'methods' || c.methods.includes(it.method)) &&
    (skip === 'types' || c.types.includes(it.type)));
}

  ctx = ctx || {};
  const am = ctx.am || itemsAttemptMap();

  if (basis === 'wrong') return items.filter(it => { const a = am.get(it.id); return a && !a[a.length - 1].correct; });
  if (basis === 'flagged') return items.filter(it => DB.flags[it.id]);

    const byC = groupBy(DB.attempts, a => a.conceptId);
    const cache = {};
    return items.filter(it => (cache[it.conceptId] = cache[it.conceptId] || calc.conceptState(byC.get(it.conceptId) || [])) !== 'mastered');
  }

}
function countMatch(c, skip) { return applyBasis(baseMatch(c, skip), skip === 'basis' ? 'all' : c.basis).length; }
function isRestricted(c, dim) {
  if (dim === 'scope') return c.topics.length < allTopicKeys().length;
  if (dim === 'rounds') return c.rounds.length < allRoundKeys().length;
  if (dim === 'diffs') return c.diffs.length < 3;
  if (dim === 'methods') return c.methods.length < METHOD_KEYS.length;
  if (dim === 'types') return c.types.length < 3;
  if (dim === 'basis') return c.basis !== 'all';

}
function relaxDim(c, dim) {

}

}

    const key = it => { const s = cs.get(it.conceptId); return (s && s.rate != null ? s.rate : 0.6) + Math.random() * 0.15; };
    pool = pool.map(it => ({ it, k: key(it) })).sort((a, b) => a.k - b.k).map(x => x.it);

function criteriaSummary(c) {

    const byU = groupBy(c.topics, k => k.split('-')[0]);
    for (const [u, ks] of byU) {
      const all = tk.filter(k => k.split('-')[0] === u).length;
      parts.push(unitShort(Number(u)) + (ks.length >= all ? '' : ' 주제 ' + ks.map(k => k.split('-')[1]).join('·')));
    }
  }
  if (c.rounds.length < allRoundKeys().length) parts.push(c.rounds.map(r => r === 'x' ? '모의·보강' : r + '회차').join('·'));
  if (c.diffs.length < 3) parts.push('난이도 ' + c.diffs.join('·'));
  if (c.methods.length < METHOD_KEYS.length) {

    const rest = c.methods.filter(m => !g.some(x => x.methods.includes(m)));

  }

function startFromCriteria(c, name) {

  startSitting({ mode: 'custom', title: name || '맞춤 세트', itemIds: ids, criteria: { ...c }, gradeMode: c.grade, timer });
}

/* ---- 실전 모의 자동 구성 ---- */
function buildAutoMock(target) {
  target = target || 26;

  if (!all.length) return { ids: [], info: null };
  const N = Math.min(target, all.length);
  const fewRecords = DB.attempts.length < 30;
  const cs = calc.conceptStats(DB.attempts);

  const same = VIEW.lastHash === location.hash;
  VIEW.lastHash = location.hash;
  VIEW.token = (VIEW.token || 0) + 1; VIEW.name = name; VIEW.args = args;
  SESSION.route = name;
  document.body.classList.remove('focus');
  $('#app').classList.remove('wide');
  const view = $('#view');
  const keepY = same ? window.scrollY : 0;
  view.innerHTML = '';
  renderNav(name); renderTopbar(); renderBanners();
  try {
    const r = ROUTES[name](view, ...args);
    if (r && typeof r.then === 'function') r.then(() => { if (same) window.scrollTo(0, keepY); }).catch(err => showError(view, err));
    else if (same) window.scrollTo(0, keepY);
  } catch (e) { showError(view, e); }
  if (!same) window.scrollTo(0, 0);
}
function applyThemeMeta() {
  const t = DB.settings.theme;
  for (const m of $$('meta[name="theme-color"]')) {
    if (t === 'light') m.setAttribute('content', '#f0e8d9');
    else if (t === 'dark') m.setAttribute('content', '#1c1612');
    else m.setAttribute('content', m.getAttribute('media') && m.getAttribute('media').includes('dark') ? '#1c1612' : '#f0e8d9');
  }
}
async function init() {
  store.probe();
  loadDB();
  applyTheme(); applyThemeMeta();
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(v => { SESSION.persisted = !!v; const el = $('#persist-state'); if (el) el.textContent = v ? '지워지지 않게 요청됨' : '브라우저가 정함'; }).catch(() => { SESSION.persisted = false; });
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => { /* 무시: 오프라인 기능만 빠짐 */ });
  }
  renderNav('home');
  $('#view').appendChild(h('p', { class: 'muted', text: '불러오는 중…' }));
  await loadManifest();
  indexManifest();
  if (DATA.manifest) { await loadUnits(); checkNewVersion(); }
  window.addEventListener('hashchange', route);
  window.addEventListener('online', () => renderTopbar(VIEW.name === 'solve' || VIEW.name === 'print' ? { hidden: true } : null));
  window.addEventListener('offline', () => renderTopbar(VIEW.name === 'solve' || VIEW.name === 'print' ? { hidden: true } : null));
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onMq = () => { if (VIEW.name === 'dash') route(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq);
  }
  route();
  if (DATA.manifest) {
    loadBank().then(() => { if (SESSION.route === 'home') route(); else renderBanners(); });
    if (isIOS() && !isStandalone()) showInstallGuide(false);
    else showGuide(false);
  }
  SESSION.ready = true;
}

/* 검산·디버그용 네임스페이스 */
window.T2R = {
  build: APP_BUILD, calc, metrics, DB, DATA, store,
  sliceAttempts, buildAutoMock, countMatch, normCriteria, pickItems, parseBackup, applyBackup, buildBackup,
  reload() { loadDB(); route(); },
  ready: () => !!SESSION.ready && (!DATA.manifest || DATA.bankLoaded)
};
init();

})();
</script>
